  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['Fraunces', 'Georgia', 'serif'],
          },
        },
      },
    };

  <style type="text/tailwindcss">
    @layer components {
      .btn { @apply inline-flex items-center justify-center gap-2 rounded-full px-5 py-3 text-sm font-medium transition active:scale-[.98] disabled:opacity-50 disabled:pointer-events-none; }
      .btn-primary { @apply bg-stone-900 text-white hover:bg-stone-800; }
      .btn-soft { @apply bg-stone-100 text-stone-800 hover:bg-stone-200; }
      .btn-ghost { @apply text-stone-600 hover:bg-stone-100; }
      .btn-danger { @apply bg-red-50 text-red-700 hover:bg-red-100; }
      .input { @apply w-full rounded-2xl border border-stone-200 bg-white px-4 py-3 text-base text-stone-900 placeholder-stone-400 outline-none focus:border-stone-900 focus:ring-0; }
      .label { @apply mb-1.5 block text-xs font-medium uppercase tracking-wide text-stone-500; }
      .chip { @apply inline-flex items-center gap-1.5 rounded-full border border-stone-200 bg-white px-3.5 py-2 text-sm text-stone-700 transition; }
      .chip-on { @apply border-stone-900 bg-stone-900 text-white; }
      .card { @apply rounded-3xl bg-white shadow-sm ring-1 ring-stone-100; }
    }
  </style>
  <style>
    html, body { background: #fafaf9; }
    /* Tamanho dos ícones sem depender do Tailwind: evita ícones gigantes se o CSS demorar ou falhar. */
    svg { flex-shrink: 0; width: 1.25rem; height: 1.25rem; }
    svg.h-3 { width: .75rem; height: .75rem; }
    svg.h-4 { width: 1rem; height: 1rem; }
    svg.h-7 { width: 1.75rem; height: 1.75rem; }
    svg.h-8 { width: 2rem; height: 2rem; }
    body { -webkit-tap-highlight-color: transparent; }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
    :focus-visible { outline: 2px solid #1c1917; outline-offset: 2px; }

    .checker {
      background-color: #f5f5f4;
      background-image:
        linear-gradient(45deg, #e7e5e4 25%, transparent 25%),
        linear-gradient(-45deg, #e7e5e4 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #e7e5e4 75%),
        linear-gradient(-45deg, transparent 75%, #e7e5e4 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0;
    }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .fade-up { animation: fadeUp .25s ease-out; }
    @keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
    .sheet-up { animation: sheetUp .25s ease-out; }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    .skeleton {
      background: linear-gradient(90deg, #f5f5f4 25%, #e7e5e4 50%, #f5f5f4 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .fade-up, .sheet-up, .skeleton { animation: none; }
    }

    /* Rodapé de autoria */
    .app-footer {
      position: fixed;
      inset-inline: 0;
      bottom: 0;
      z-index: 20;
      padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
      background: rgba(250, 250, 249, 0.96);
      border-top: 1px solid #e7e5e4;
      text-align: center;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: #78716c;
      pointer-events: none;
    }
    /* Com a navegação inferior visível, o crédito fica logo acima dela. */
    body.has-bottomnav .app-footer {
      bottom: calc(60px + env(safe-area-inset-bottom));
    }
  </style>
</head>
<body class="min-h-screen font-sans text-stone-900 antialiased">
  <a href="#view" class="sr-only focus:not-sr-only focus:fixed focus:left-3 focus:top-3 focus:z-[70] focus:rounded-full focus:bg-white focus:px-4 focus:py-2">Pular para o conteúdo</a>

  <main id="view" class="mx-auto w-full max-w-xl px-4 pb-32 pt-6" tabindex="-1">
    <div id="boot" class="mt-24 text-center">
      <div class="mx-auto mb-4 h-14 w-14 animate-pulse rounded-2xl bg-stone-900"></div>
      <p class="font-display text-2xl">Smart Closet AI</p>
      <p class="mt-1 text-sm text-stone-500">Abrindo seu closet…</p>
      <noscript><p class="mt-4 text-sm text-red-700">Ative o JavaScript do navegador para usar o app.</p></noscript>
    </div>
  </main>

  <nav id="bottomnav" class="safe-bottom fixed inset-x-0 bottom-0 z-30 hidden border-t border-stone-200 bg-white/95 backdrop-blur" aria-label="Navegação principal"></nav>

  <!-- Rodapé de autoria -->
  <footer class="app-footer">Developed by Julio Gonzales</footer>

  <div id="modal-root"></div>
  <div id="busy" class="fixed inset-0 z-50 hidden items-center justify-center bg-stone-900/40 backdrop-blur-sm" role="status" aria-live="polite">
    <div class="flex max-w-xs items-center gap-3 rounded-2xl bg-white px-5 py-4 shadow-xl">
      <span class="h-5 w-5 shrink-0 animate-spin rounded-full border-2 border-stone-300 border-t-stone-900"></span>
      <span id="busy-text" class="text-sm text-stone-700">Carregando…</span>
    </div>
  </div>
  <div id="toast" class="pointer-events-none fixed inset-x-0 top-4 z-[60] flex flex-col items-center gap-2 px-4" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <script type="module" src="js/app.js"></script>

  <script>
    // Ajusta o rodapé conforme a navegação inferior é exibida ou ocultada.
    (function () {
      var nav = document.getElementById('bottomnav');
      if (!nav) return;
      function update() {
        document.body.classList.toggle('has-bottomnav', !nav.classList.contains('hidden'));
      }
      new MutationObserver(update).observe(nav, { attributes: true, attributeFilter: ['class'] });
      update();
    })();

    // Rede de segurança: se o app não iniciar, mostra uma mensagem em vez de tela em branco.
    (function () {
      function fail(msg) {
        if (window.__appBooted) return;
        var boot = document.getElementById('boot');
        if (!boot) return;
        boot.innerHTML =
          '<p class="font-display text-2xl">Não consegui abrir o app</p>' +
          '<p class="mx-auto mt-2 max-w-xs text-sm text-stone-500">' + msg + '</p>' +
          '<button onclick="location.reload()" class="btn btn-primary mt-5">Tentar de novo</button>';
      }
      window.addEventListener('error', function (e) {
        if (e && e.message) fail('Verifique sua internet e tente de novo. (' + e.message + ')');
      });
      setTimeout(function () {
        fail('A conexão está lenta ou alguma biblioteca não carregou. Verifique a internet e tente de novo.');
      }, 12000);
      // Se os estilos (Tailwind) não carregarem, avisa em vez de mostrar a tela sem formatação.
      setTimeout(function () {
        if (window.tailwind) return;
        var note = document.createElement('div');
        note.className = 'mx-4 mt-3 rounded-2xl bg-amber-50 p-3 text-xs text-amber-900';
        note.textContent = 'Os estilos do app não carregaram. Verifique a internet, desative bloqueadores de conteúdo do Safari e recarregue a página.';
        document.body.insertBefore(note, document.body.firstChild);
      }, 6000);
    })();
  </script>
</body>
