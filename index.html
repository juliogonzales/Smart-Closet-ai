<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Smart Closet AI</title>
  <meta name="description" content="Seu guarda-roupa digital com estilista de IA.">
  <meta name="theme-color" content="#1c1917">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['Fraunces', 'Georgia', 'serif'],
          },
        },
      },
    };
  </script>
  <style type="text/tailwindcss">
    @layer components {
      .btn { @apply inline-flex items-center justify-center gap-2 rounded-full px-5 py-3 text-sm font-medium transition active:scale-[.98] disabled:opacity-50 disabled:pointer-events-none; }
      .btn-primary { @apply bg-stone-900 text-white hover:bg-stone-800; }
      .btn-soft { @apply bg-stone-100 text-stone-800 hover:bg-stone-200; }
      .btn-ghost { @apply text-stone-600 hover:bg-stone-100; }
      .btn-danger { @apply bg-red-50 text-red-700 hover:bg-red-100; }
      .input { @apply w-full rounded-2xl border border-stone-200 bg-white px-4 py-3 text-sm text-stone-900 placeholder-stone-400 outline-none focus:border-stone-900 focus:ring-0; }
      .label { @apply mb-1.5 block text-xs font-medium uppercase tracking-wide text-stone-500; }
      .chip { @apply inline-flex items-center gap-1.5 rounded-full border border-stone-200 bg-white px-3.5 py-2 text-sm text-stone-700 transition; }
      .chip-on { @apply border-stone-900 bg-stone-900 text-white; }
      .card { @apply rounded-3xl bg-white shadow-sm ring-1 ring-stone-100; }
    }
  </style>
  <style>
    html, body { background: #fafaf9; }
    body { -webkit-tap-highlight-color: transparent; }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
    .checker { background-color: #f5f5f4; background-image: linear-gradient(45deg,#e7e5e4 25%,transparent 25%),linear-gradient(-45deg,#e7e5e4 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e7e5e4 75%),linear-gradient(-45deg,transparent 75%,#e7e5e4 75%); background-size: 16px 16px; background-position: 0 0,0 8px,8px -8px,-8px 0; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .fade-up { animation: fadeUp .25s ease-out; }
    @keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
    .sheet-up { animation: sheetUp .25s ease-out; }
  </style>
</head>
<body class="min-h-screen font-sans text-stone-900 antialiased flex flex-col justify-between">
  <main id="view" class="mx-auto w-full max-w-xl px-4 pb-12 pt-6"></main>

  <footer class="w-full py-6 text-center text-xs text-stone-500 pb-20">
    Developed by <span class="font-semibold text-amber-500">Julio Gonzales</span>
  </footer>

  <nav id="bottomnav" class="safe-bottom fixed inset-x-0 bottom-0 z-30 hidden border-t border-stone-200 bg-white/95 backdrop-blur" aria-label="Navegação principal"></nav>

  <div id="modal-root"></div>
  <div id="busy" class="fixed inset-0 z-50 hidden items-center justify-center bg-stone-900/40 backdrop-blur-sm">
    <div class="flex items-center gap-3 rounded-2xl bg-white px-5 py-4 shadow-xl">
      <span class="h-5 w-5 animate-spin rounded-full border-2 border-stone-300 border-t-stone-900"></span>
      <span id="busy-text" class="text-sm text-stone-700">Carregando…</span>
    </div>
  </div>
  <div id="toast" class="pointer-events-none fixed inset-x-0 top-4 z-[60] flex justify-center px-4"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
